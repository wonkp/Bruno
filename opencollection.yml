opencollection: 1.0.0

info:
  name: wonkp
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: authorization
    value: "{{token}}"
    placement: header
  scripts:
    - type: before-request
      code: |-
        // 定义变量
        let systemUrl = bru.getEnvVar('system-url');
        // 默认用户名密码
        let username = '8613752410338';
        let password = '123456';
        // 本地环境用户名密码
        if (systemUrl.includes('localhost')) {
          systemUrl = 'https://test-api.mathplore.com/system-base'
          username = '8613752410338';
          password = '123456';
        }
        // 测试环境用户名密码
        if (systemUrl.includes('test')) {
          username = '8613752410338';
          password = '123456';
        }
        // 迁移环境用户名密码
        if (systemUrl.includes('migrate')) {
          username = '0';
          password = '0';
        }

        const loginUrl = systemUrl + '/web/login';

        const response = await bru.sendRequest({
          method: 'POST',
          url: loginUrl,
          data: {
            "username": username,
            "password": password,
            "platform": "WEB",
            "type": 1,
            "forcedLogin": false,
            "deviceId": "5d35b1af-63de-48a1-bd94-ef4a74e77f8f"
        }
        }, function(err, res) {
          if (err) {
            console.error('Failed to get token:', err);
            return;
          }
          if (res.data.code!=0) {
            console.error('login fail');
            return;
          }
          bru.setVar('token', res.data.data.tokenValue);
        });
bundled: false
extensions:
  bruno:
    ignore:
      - .idea
      - node_modules
      - .git
