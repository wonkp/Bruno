info:
  name: 考情监控分页
  type: http
  seq: 18

http:
  method: POST
  url: "{{teaching-url}}/attendance/clazz/page"
  body:
    type: json
    data: |-
      {
        "clazzStatus": 1,
        "pageSize": 10,
        "page": 1,
        "startTimeFrom": "2026-10-01T00:00:00",
        "startTimeTo": "2026-10-22T00:00:00",
        "weekdayHours":[{"weekday":1,"hourTime":"00:00"},{"weekday":1,"hourTime":"01:00"},{"weekday":2,"hourTime":"00:00"}]
