info:
  name: 查询对话详情
  type: http
  seq: 2

http:
  method: GET
  url: "{{coze-url}}/v3/chat/retrieve?conversation_id=7700138502881411112&chat_id=7700138502881443880"
  headers:
    - name: Authorization
      value: Bearer {{coze-token}}
  params:
    - name: conversation_id
      value: "7700138502881411112"
      type: query
    - name: chat_id
      value: "7700138502881443880"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## 查询对话详情

  依赖上一个请求写入的 `coze-chat-id` / `coze-conversation-id`。

  ### 状态枚举（`data.status`）

  | 状态 | 含义 | 后端处理 |
  |---|---|---|
  | `created` | 已创建 | 继续轮询 |
  | `in_progress` | 处理中 | 继续轮询 |
  | `completed` | 已完成 | 去查消息列表取正文 |
  | `failed` | 失败 | 置失败，记 `last_error` |
  | `requires_action` | 中断，需上报工具结果 | 置失败（后台批处理无法自动完成） |
  | `canceled` | 已取消 | 置失败 |

  ### 实测

  - 短文本任务通常 **3~6 秒**完成，先等 3 秒再查基本一次就中。
  - 轮询间隔建议 ≥1 秒（设计里用 10 秒），总超时 5 分钟。
  - `data.usage` 含 token 消耗（`input_count` / `output_count` / `token_count`），可核对计费。
    实测短文本样本约 3000 token。
