docs: |-
  ## 查询对话消息详情

  **只在状态为 `completed` 后调用**，否则拿不到 answer。

  ### 返回的 data 是消息数组，按 type 区分

  | type | 是否入库 | 说明 |
  |---|---|---|
  | `answer` | **是** | 巡课报告正文。多 answer 时按出现顺序拼接 |
  | `verbose` | 否 | 控制信号，`msg_type=generate_answer_finish` 表示所有 answer 结束 |
  | `follow_up` | 否 | 推荐问题 |
  | `function_call` / `tool_response` | 否 | 工具调用中间结果 |

  ### 实测样本（接口成功、业务失败）

  ```json
  {"type":"answer","content_type":"text","role":"assistant",
   "content":"【巡课智能体】本节未生成报告：课件等级缺失或逐字稿解析失败，请人工复核后重跑。"}
  {"type":"verbose","content":"{\"msg_type\":\"generate_answer_finish\",\"data\":\"\",...}"}
  ```

  ### 重要

  **接口 `code=0` 且 `status=completed` 不等于业务成功。**
  工作流在入参缺失或解析失败时会返回一条兜底文案作为 answer，
  这条文案会被正常当成报告落库。

  上线前必须和 Coze 侧确认：
  1. 兜底文案的固定前缀（如 `【巡课智能体】`）是什么；
  2. 后端是否要按该前缀判失败，避免把「未生成报告」的提示当成报告存进 `video_agent_cc`。
