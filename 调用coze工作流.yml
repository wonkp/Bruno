          "text": "00:00:02可以请宝贝到屏幕面前来，我们开始上课。00:00:06好，欢迎你。00:00:09那宝贝可能要调整一下摄像头，让老师能够看到你完整的脸蛋。00:00:17好，可以听到我的声音，看到我的画面吗？00:00:22如果可以的话，请丞丞挥挥小手给老师打一个招呼，可以吗？00:00:26晚上好，说明我们设备是没有问题的。00:00:29欢迎你来到老师的课堂。00:00:31今天需要成成和老师一起来完成一个数学挑战。00:00:35在开始之前我们先做一个自我介绍，互相了解一下对方。00:00:40我先来，我的名字叫做维尼，你叫我维尼老师就可以了。00:00:45除了名字我还要介绍一下我的兴趣爱好。00:00:48我最喜欢做的事情就是吃美食，尤其喜欢吃冰淇淋。00:00:53想问一问成成，你喜欢吃冰淇淋吗？00:00:57喜欢，看来你和老师一样，都喜欢吃冰淇淋。00:01:00现在你就已经认识我了，我也要请你做一个自我介绍，让老师认识一下你。00:01:08我叫王子。00:01:11好，我可以叫你成成吗？00:01:14可以。00:01:15好，晨晨你好，请问你今年几岁？00:01:17上几年级了？00:01:19池水三月三，已经是一年级的小朋友了。00:01:23那成成你有没有什么兴趣爱好可以和老师分享一下。00:01:30比如说唱歌跳舞、打篮球、踢足球这种都可以的。00:01:36游泳泳，喜欢运动很好。00:01:38欢迎晨晨来到老师的课堂，刚刚自我介绍非常的勇敢大方。00:01:44晨晨你看一看你能不能调整一下设备，可能要更远一点。00:01:53好啊，现在就可以了。00:01:57刚刚在自我介绍的时候，老师送给了你一些小星星，你看有几颗了？00:02:03六颗。00:02:03对，这就是我对你自我介绍的奖励了。00:02:06除了自我介绍，我们在闯关的时候也能够获得更多的星星。00:02:11你来选一选，我这里有二十颗、三十颗和四十颗来设定一个目标，你想获得多少颗呢？00:02:19四十可可可以，这么有勇气我们就定下最多的目标。00:02:23到最后我们就来看一看程程能不能达到自己的目标。00:02:27现在我们就一起来认识一个闯关的小伙伴，他在我们的屏幕中间是一个什么动物？00:02:39你认识他吗？00:02:41对，我们听一听他叫什么名字，我叫潘潘，你叫什么名字？00:02:48他就是我们的好朋友潘潘了。00:02:51今天三个人已经集合完毕，跟着潘潘一起出发，看一看会遇到哪些冒险。00:03:00潘潘把我们带到了还原魔术秀的现场，魔术表演要开始了，看来我们要和潘潘一起看表演了。00:03:12好，看到我们的屏幕，魔术师要闪亮登场了。00:03:19需还原魔术要开始了。00:03:21橙橙仔细看，魔术师拿出一块方巾，大手一挥，你看他变出了一个什么水果？00:03:30西瓜瓜西瓜能变什么魔术呢？00:03:33我还是第一次见。00:03:35仔细看发生什么变化了，这个西瓜变成了一粒棒棒糖，成成一半这个词抓取的非常的精准。00:03:47那消失的一半去哪里了呢？00:03:50西瓜又怎么样了？00:03:52要变回来。00:03:54看来这就是还原魔术，先把一半给消失掉，再变成原来的样子。00:04:01嘿，我想要饼干，西瓜怎么变成饼干？00:04:05我们看魔术师怎么变帽子下面果然是一盒饼干，现在魔术师还要施展他的魔术，饼干发生什么变化了？00:04:19饼干里面的一半的饼干没有了，表达的非常的清楚。",
